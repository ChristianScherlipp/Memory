<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memory</title>
</head>
<body>
    <div id="app">
        <section id="page-start" class="page">
            <div class="page-start__heading">
                <p class="page-start__intro">It's time to play.</p>
                <h1 class="page-start__title">Ready to play ?</h1>
            </div>
            <button id="play-button" class="button button--play" type="button">
                <img class="button__icon" src="./assets/icons/controller.svg" alt="">
                <span class="button__label">play</span>
                <img class="button__icon" src="./assets/icons/arrow_right.svg" alt="">
            </button>
        </section>
        <section id="page-settings" class="page" hidden>
            <h2 class="page-settings__title">Einstellungen</h2>
            <div id="settings-form"></div>
        </section>
        <section id="page-game" class="page" hidden>
            <div id="game-board"></div>
        </section>
        <section id="page-end" class="page" hidden>
            <div id="game-end"></div>
        </section>
    </div>

    <script type="module" src="src/main.ts"></script>
</body>
</html>
