<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Memory – a two-player card matching game with selectable board size and visual themes.">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <title>Memory</title>
</head>
<body>
    <main id="app">
        <!-- Start screen -->
        <section id="page-start" class="page" tabindex="-1">
            <div class="page-start__heading">
                <p class="page-start__intro">It's time to play.</p>
                <h1 class="page-start__title">Ready to play?</h1>
            </div>
            <button id="play-button" class="button button--play" type="button">
                <img class="button__icon" src="./assets/icons/controller.svg" alt="">
                <span class="button__label">play</span>
                <img class="button__icon" src="./assets/icons/arrow_right.svg" alt="">
            </button>
        </section>

        <!-- Settings screen: player colour, board size, theme -->
        <section id="page-settings" class="page" tabindex="-1" hidden>
            <h1 class="page-settings__title">Settings</h1>
            <div id="settings-form"></div>
        </section>

        <!-- Game screen: status bar + board are rendered into #game-board -->
        <section id="page-game" class="page" tabindex="-1" aria-label="Game board" hidden>
            <div id="game-board"></div>

            <dialog id="exit-dialog" class="modal" aria-labelledby="exit-dialog-title">
                <div class="modal__box">
                    <h2 id="exit-dialog-title" class="modal__title">Leave the game?</h2>
                    <p class="modal__text">Your current progress will be lost.</p>
                    <div class="modal__actions">
                        <button type="button" id="exit-cancel-button" class="button">
                            Continue game
                        </button>
                        <button type="button" id="exit-confirm-button" class="button button--exit">
                            Back to settings
                        </button>
                    </div>
                </div>
            </dialog>
        </section>

        <!-- End screen: win / game over / draw is rendered into #game-end -->
        <section id="page-end" class="page" tabindex="-1" aria-label="Game result" hidden>
            <div id="game-end"></div>
        </section>
    </main>

    <noscript>This game needs JavaScript to run. Please enable it in your browser.</noscript>

    <script type="module" src="src/main.ts"></script>
</body>
</html>
